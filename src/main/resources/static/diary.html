<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成长日记 - 福元的世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑", sans-serif; }
        .header-banner {
            height: 200px; background: linear-gradient(to right,#fceabb,#f8b500);
            background-image: url("images/fuyuan3.jpg"); background-size: cover;
            background-position: center; display: flex; align-items: center; justify-content: center;
        }
        .banner-title { color: white; font-size: 26px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
        .navbar { background-color: #fceabb; padding: 15px 0; text-align: center; border-bottom: 1px solid #f8b500; }
        .navbar a { text-decoration: none; color: #8b5a2b; margin: 0 15px; font-size: 15px; font-weight: 500; }
        .navbar a:hover { color: #d97634; }
        .main-content { background-color: #fff8e6; padding: 40px 10%; min-height: 500px; }
        .section-title { text-align: center; color: #8b5a2b; font-size: 24px; margin-bottom: 30px; position: relative; }
        .section-title::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background-color: #f8b500; }
        .diary-list { max-width: 800px; margin: 0 auto; }
        .diary-item {
            background: white; border-radius: 10px; padding: 24px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #f8b500;
        }
        .diary-item h3 { color: #8b5a2b; font-size: 18px; margin-bottom: 8px; }
        .diary-meta { color: #a1887f; font-size: 13px; margin-bottom: 12px; }
        .diary-meta .tag {
            display: inline-block; background: #fceabb; color: #8b5a2b;
            padding: 2px 10px; border-radius: 10px; font-size: 12px; margin-left: 10px;
        }
        .diary-content { color: #5d4037; line-height: 1.8; font-size: 14px; white-space: pre-wrap; }
        .pagination { text-align: center; margin-top: 30px; }
        .pagination button {
            background: #f8b500; color: white; border: none; padding: 8px 20px;
            border-radius: 5px; cursor: pointer; margin: 0 5px; font-size: 14px;
        }
        .pagination button:disabled { background: #e0e0e0; cursor: not-allowed; }
        .page-info { color: #8b5a2b; margin: 0 15px; font-size: 14px; }
        .footer { background-color: #8b5a2b; color: white; text-align: center; padding: 15px 0; font-size: 14px; }
        @media (max-width: 768px) {
            .header-banner { height: 160px; }
            .banner-title { font-size: 20px; }
            .navbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; padding: 12px 10px; }
            .navbar a { margin: 0; font-size: 13px; }
            .main-content { padding: 20px 5%; }
            .diary-item { padding: 18px 16px; }
            .diary-item h3 { font-size: 16px; }
            .section-title { font-size: 20px; }
            .pagination button { padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <header class="header-banner"><h1 class="banner-title">福元的成长日记</h1></header>
    <nav class="navbar">
        <a href="index.html">首页</a>
        <a href="diary.html">成长日记</a>
        <a href="photo.html">照片相册</a>
        <a href="friends.html">🐾 朋友们</a>
        <a href="message.html">留言板</a>
    </nav>
    <main class="main-content">
        <h2 class="section-title">📖 日记列表</h2>
        <div class="diary-list" id="diary-list">加载中...</div>
        <div class="pagination" id="pagination"></div>
    </main>
    <footer class="footer"><p>| 福元的世界 |</p></footer>
    <script>
        let currentPage = 1;
        const pageSize = 5;

        function loadDiaries() {
            fetch('/api/diaries/page?page=' + currentPage + '&size=' + pageSize)
                .then(r => r.json())
                .then(res => {
                    const list = document.getElementById('diary-list');
                    const pageEl = document.getElementById('pagination');
                    if (res.code !== 200 || !res.data) { list.innerText = '暂无日记'; pageEl.innerHTML = ''; return; }
                    const { records, total } = res.data;
                    if (!records.length) { list.innerText = '暂无日记'; pageEl.innerHTML = ''; return; }
                    list.innerHTML = records.map(d => `
                        <div class="diary-item">
                            <h3>${d.title}</h3>
                            <div class="diary-meta">
                                ${d.eventDate ? d.eventDate : ''}
                                ${d.diaryType ? `<span class="tag">${d.diaryType}</span>` : ''}
                            </div>
                            <div class="diary-content">${d.content || ''}</div>
                        </div>
                    `).join('');
                    const totalPages = Math.ceil(total / pageSize);
                    pageEl.innerHTML = `
                        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>
                        <span class="page-info">第 ${currentPage} / ${totalPages} 页（共 ${total} 篇）</span>
                        <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>
                    `;
                })
                .catch(err => { document.getElementById('diary-list').innerText = '加载失败'; console.error(err); });
        }
        function goPage(p) { currentPage = p; loadDiaries(); }
        document.addEventListener('DOMContentLoaded', loadDiaries);
    </script>
</body>
</html>
